<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="author" content="Dong-Hyuk Lee">
  <meta name="theme-color" content="#f6f5f1">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="icon" type="image/svg+xml" href="{{PREFIX}}assets/favicon.svg">
  <script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('dh-profile-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="{{PREFIX}}assets/styles.css">
  <script type="application/ld+json">{{SCHEMA}}</script>
  <script src="{{PREFIX}}assets/citations.js" defer></script>
  <script src="{{PREFIX}}assets/site.js" defer></script>
</head>
<body id="top">
{{HEADER}}
{{BODY}}
{{FOOTER}}
</body>
</html>
